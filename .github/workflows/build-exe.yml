# Сборка competition_monitor.exe на Windows (PyInstaller не собирает .exe на macOS/Linux).
# Запуск: вкладка Actions → build-exe → Run workflow; готовый .exe — в Artifacts запуска.
name: build-exe
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: competition_monitor-windows
          path: dist/competition_monitor.exe
